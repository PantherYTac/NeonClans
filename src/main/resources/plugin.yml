name: NeonClans
version: 1.0.0
main: com.neonclans.NeonClans
api-version: '1.20'
description: A highly customizable and premium Minecraft clans plugin with upgrades, alliances, vaults, and custom tags.
authors: [Antigravity]
softdepend: [Vault, PlaceholderAPI]
commands:
  clan:
    description: Main command for NeonClans.
    aliases: [c, clans]
    permission: neonclans.use
    usage: /clan [subcommand]
